name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use preinstalled Android SDK
        # android-actions/setup-android@v3 fails on the Oct 2026 runner
        # image (sdkmanager: package 'tools' not found, exit 1). The
        # runner already ships the SDK at /usr/local/lib/android/sdk,
        # so point Gradle at it instead of reinstalling via that action.
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          ls /usr/local/lib/android/sdk/build-tools
          ls /usr/local/lib/android/sdk/platforms

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Validate Kotlin compilation
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace